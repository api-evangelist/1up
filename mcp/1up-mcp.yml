status: published
name: 1up MCP Server
description: >-
  Model Context Protocol server for the 1up knowledge-management platform. Lets an MCP
  client manage questionnaires, the Q&A library, knowledge-base documents and knowledge
  groups inside a 1up workspace. 1up sells it as a first-class product tier: the $50/month
  "MCP" plan on https://1up.ai/pricing includes the server and bills questionnaire
  automation through it at $0.05 per question answered.
deployment:
  mode: both
  endpoint: https://mcp.1up.ai/mcp
  install: pip install 1up-mcp
  package: https://pypi.org/project/1up-mcp/
  auth: oauth
  verified: probed
  note: >-
    The hosted endpoint is the vendor's current recommendation; the PyPI package 1up-mcp
    (0.1.0, published 2026-03-27) still ships the `1up-mcp auth login` OAuth CLI and
    previously ran the server locally over stdio. The vendor's own docs carry a
    "Migrating from Local (PyPI) Install" section telling users to replace
    {"command": "1up-mcp"} with {"type": "http", "url": "https://mcp.1up.ai/mcp"}, so
    stdio is a deprecated-but-published path rather than a parallel product.
server:
  name: 1up
  transport: http
  transport_detail: Streamable HTTP
  url: https://mcp.1up.ai/mcp
  documentation: https://help.1up.ai/en/articles/14304740-mcp
  client_id: TAWQL8mbs0eHLzaBaxV3Va5vH6qal4Wq
  auth:
    type: oauth2
    flow: authorization_code
    pkce: S256
    dynamic_client_registration: https://mcp.1up.ai/register
    authorization_endpoint: https://mcp.1up.ai/authorize
    token_endpoint: https://mcp.1up.ai/token
    scopes: [openid, profile, email, offline_access]
    discovery:
      authorization_server: https://mcp.1up.ai/.well-known/oauth-authorization-server
      protected_resource: https://mcp.1up.ai/.well-known/oauth-protected-resource
  environment_variables:
  - name: ONEUP_AUTH_TOKEN
    description: Bearer token, overrides cached credentials
  - name: ONEUP_API_URL
    description: API base URL
  - name: ONEUP_WORKSPACE_ID
    description: Workspace ID to use
