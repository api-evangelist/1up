tool_count: 31
tool_count_note: >-
  1up's documentation groups the tools as Q&A Library (6), Questionnaires (11), Knowledge
  Base (4), Knowledge Groups (5) and Workspace (4) — but the Knowledge Groups table lists
  SIX tools, not five, so the documented tool set actually totals 31. Counted from the
  published tables, not from the group headings.
tools:
- group: Q&A Library
  members:
  - name: ask_question
    description: Query the knowledge base with optional filters
  - name: search_qa_library
    description: Search Q&A pairs with pagination
  - name: get_qa_pair
    description: Get a specific Q&A pair by ID
  - name: create_qa_pair
    description: Create a new Q&A pair
  - name: update_qa_pair
    description: Update an existing Q&A pair
  - name: delete_qa_pair
    description: Archive a Q&A pair
- group: Questionnaires
  members:
  - name: upload_questionnaire
    description: Upload XLSX/DOCX/PDF/CSV questionnaire files
  - name: list_questionnaires
    description: List questionnaires with status/search filters
  - name: get_questionnaire
    description: Get full questionnaire details
  - name: get_questionnaire_questions
    description: Get questions with answers
  - name: update_questionnaire_answer
    description: Edit a specific answer
  - name: approve_question
    description: Mark an answer as approved
  - name: bulk_approve_questions
    description: Approve multiple questions at once
  - name: regenerate_answer
    description: Regenerate AI answer for a question
  - name: assign_question
    description: Assign a question to a team member
  - name: add_question_comment
    description: Add a comment to a question
  - name: request_questionnaire_export
    description: Export as XLSX/DOCX/CSV
- group: Knowledge Base
  members:
  - name: list_kb_items
    description: List items with search/source filters
  - name: get_kb_item
    description: Get KB item details
  - name: upload_kb_document
    description: Upload PDF/DOCX/XLSX/CSV documents
  - name: delete_kb_item
    description: Delete a KB item
- group: Knowledge Groups
  members:
  - name: list_knowledge_groups
    description: List all groups
  - name: get_knowledge_group
    description: Get group with its documents and Q&A pairs
  - name: create_knowledge_group
    description: Create a new group
  - name: add_items_to_knowledge_group
    description: Add documents/Q&A pairs to a group
  - name: remove_items_from_knowledge_group
    description: Remove items from a group
  - name: delete_knowledge_group
    description: Delete a group (items are ungrouped, not deleted)
- group: Workspace
  members:
  - name: list_workspaces
    description: List accessible workspaces
  - name: get_workspace_info
    description: Get workspace details, plan, limits, usage
  - name: switch_workspace
    description: Switch active workspace
  - name: get_audit_events
    description: Get audit events with pagination
