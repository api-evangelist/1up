apis:
- aid: 1up:1up-mcp-server
  name: 1up MCP Server
  description: 'The 1up MCP Server is a cloud-hosted Model Context Protocol server that lets an AI assistant
    work directly against a 1up workspace — query the knowledge base, search and edit the Q&A library,
    upload and drive questionnaires, manage knowledge-base documents and knowledge groups, switch workspaces
    and read audit events. It speaks MCP over Streamable HTTP at https://mcp.1up.ai/mcp and authenticates
    with OAuth 2.1 (authorization code + PKCE S256, dynamic client registration), advertised through RFC
    8414 and RFC 9728 discovery documents on the same host. 1up documents 31 tools in five groups: Q&A
    Library (6), Questionnaires (11), Knowledge Base (4), Knowledge Groups (6) and Workspace (4). A companion
    PyPI package, 1up-mcp, provides the OAuth login CLI and previously ran the server locally over stdio;
    the vendor now directs users to the hosted endpoint.'
  image: https://cdn.prod.website-files.com/69c22ac6beee399088a918e7/69fb387104c89f3be337de1d_1up_favicon.png
