aid: 1up
name: 1up
description: '1up (1up Corp, 1up.ai) is a New York City based AI knowledge-automation company whose "Answer
  Engine" generates source-grounded answers for go-to-market teams. The platform connects approved knowledge
  sources — Confluence, Notion, Google Drive, OneDrive, SharePoint, Box, Dropbox, Egnyte, Salesforce,
  Highspot, Seismic, Zendesk, Gong, GitBook, GitHub and public websites — into a workspace-isolated knowledge
  base, then uses it to auto-complete RFPs, DDQs, security questionnaires and vendor assessments in Excel,
  Word, PDF, CSV and web portals such as OneTrust, Panorays and Whistic. 1up''s public machine surface
  is an MCP server rather than a REST developer program: a cloud-hosted, OAuth 2.1 protected Model Context
  Protocol endpoint at https://mcp.1up.ai/mcp exposing 31 documented tools across the Q&A library, questionnaires,
  knowledge base, knowledge groups and workspace, sold as its own $50/month pricing tier billed at $0.05
  per answered question. Founded in 2021 by the founding team behind identity-security vendor HYPR, 1up
  has raised $8.5M from Upfront Ventures and Lightbank.'
