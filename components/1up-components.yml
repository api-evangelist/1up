note: >-
  1up ships no embeddable JavaScript element library or web-component set. What it does
  ship on the client side are two browser extensions and a hosted, brandable public answer
  surface. Chat-platform apps (Slack, Microsoft Teams, Google Chat) are listed here because
  they are the delivery surface for the same answer engine, but they are installed apps
  rather than components a developer embeds.
