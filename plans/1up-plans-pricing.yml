note: >-
  1up sells its MCP server as its own priced tier — a $50/month plan whose entire value
  proposition is machine access, billed per answered question. That is rare enough to be
  worth stating plainly: for most providers in this catalog an MCP server is a free
  discovery surface bolted onto a seat-priced product; here it is the product line. The
  pricing page splits into two product tracks, "Employee Answers" (Free / MCP / Starter /
  Plus / Enterprise) and "Customer Answers" (Answer Hub).
