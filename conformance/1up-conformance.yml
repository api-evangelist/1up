domain_standard:
  applicable: false
  note: >-
    Sales-enablement / RFP-response automation has no interoperable domain standard for a
    contract to declare — no SCIM-, OData-, HL7-, OpenRTB- or LTI-equivalent exists for
    questionnaire exchange. The market's formats are the documents themselves (XLSX, DOCX,
    PDF, CSV) and vendor-specific portals (OneTrust, Panorays, Whistic, Venminder, CyberGRX,
    SecurityScorecard), all of which 1up supports as inputs. Reward-only dimension; nothing
    invented to fill it.
