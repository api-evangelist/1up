note: >-
  1up publishes exactly one package on a public code registry: the PyPI 1up-mcp MCP server
  / OAuth CLI. There is no npm, Maven, NuGet, Go, RubyGems, Packagist or crates.io package
  (checked 2026-09-05: registry.npmjs.org search for "1up.ai" returned zero results;
  1up-mcp, @1up/mcp and oneup-mcp all 404 on npm; oneup-mcp, 1up, 1up-sdk and 1up-api all
  404 on PyPI). There is no public source repository either — the package metadata names
  https://gitlab.com/1upai/mcp_server, which returns HTTP 403 and redirects to the GitLab
  sign-in page, so the code is private. The two browser extensions are store-distributed,
  not registry-distributed, and are catalogued in components/1up-components.yml.
