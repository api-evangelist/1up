limit_count: 0
note: >-
  1up publishes NO rate limits and NO rate-limit response headers. Checked: the MCP help
  article, the whole help centre, the pricing page and 1up's own published client library,
  which has no HTTP 429 branch at all — it names 400, 401, 403, 404 and 423 and falls
  through to a generic message for everything else, which is good evidence that 429 is not
  a status the platform is expected to return. No X-RateLimit-*, no RateLimit-*, no
  Retry-After behaviour is documented. An honest zero: nothing was found, and nothing was
  invented. What DOES constrain an agent here is quota and money, not requests per second —
  recorded below as quotas, which are a different fact and must not be counted as rate
  limits.
rate_limits: []
response_headers:
  documented: []
  observed: []
  note: >-
    Observed on the anonymous 401 from https://mcp.1up.ai/mcp: date, content-type,
    content-length, server (uvicorn), www-authenticate, access-control-allow-origin,
    access-control-expose-headers (Mcp-Session-Id). No rate-limit header of any family.
exhaustion_status: unknown
