runtime_signal:
  tool: get_workspace_info
  detail: >-
    The only runtime way an agent can read its own budget: 1up documents get_workspace_info
    as returning "workspace details, plan, limits, usage". Because there is no 429 and no
    header, this tool is the whole rate-limit signal — an agent should call it before any
    bulk operation rather than discovering exhaustion from a failed write.
timeouts:
  note: >-
    Client-side, from 1up's own published library — these are not server limits but they
    are the practical ceiling on a call.
  default: 30s (10s connect)
  streaming: 130s for ask_question; 1up's code notes it "can take up to 120s"
  retries: GET retried up to 2x on 5xx or timeout; POST/PATCH/DELETE never retried
gaps:
- No published rate limit of any kind.
- No 429 semantics, no Retry-After, no rate-limit headers.
- >-
  An agent that overruns cannot tell throttling from failure, and on the metered MCP tier
  every retried write is billable.
